<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prévisions — Météo chambre</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-decor" aria-hidden="true"><span></span><span></span><span></span><span></span></div>

  <div class="shell">
    <header class="glass topbar">
      <div class="brand">
        <span class="brand-icon">🌡️</span>
        <h1>Météo prévision — Chambre</h1>
      </div>
      <div id="status" class="status-pill">Chargement…</div>
    </header>

    <nav class="glass tabbar" aria-label="Navigation">
      <a href="/" class="tab">Indicateurs</a>
      <a href="/previsions" class="tab active">Prévisions</a>
    </nav>

    <main>
      <section class="chart-card">
        <h2>🌡️ Température (°C)</h2>
        <div class="legend" id="legend-temp"></div>
        <div class="chart-wrap">
          <canvas id="chart-temp"></canvas>
          <div class="tooltip" id="tooltip-temp"></div>
        </div>
      </section>

      <section class="chart-card">
        <h2>💧 Humidité (%)</h2>
        <div class="legend" id="legend-humidity"></div>
        <div class="chart-wrap">
          <canvas id="chart-humidity"></canvas>
          <div class="tooltip" id="tooltip-humidity"></div>
        </div>
      </section>

      <section class="chart-card">
        <h2>🌀 Pression (hPa)</h2>
        <div class="legend" id="legend-pressure"></div>
        <div class="chart-wrap">
          <canvas id="chart-pressure"></canvas>
          <div class="tooltip" id="tooltip-pressure"></div>
        </div>
      </section>

      <section class="meta glass" id="model-meta"></section>
    </main>

    <footer class="foot-note">Mesuré vs prédit (chambre) — observé vs prévu (extérieur, Open-Meteo)</footer>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
